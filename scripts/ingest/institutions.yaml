    script: ccba

  - key: uob
    name: United Overseas Bank Hong Kong
    short_name: UOB HK
    cn_name: 大华银行香港分行
    emails:
      - Wilson.WongKH@uobgroup.com
      - HKTransactionBanking@UOBgroup.com
    domains:
      - uobgroup.com
    subject_contains:
      - UOB Indicative Deposit
