[package]
edition = "2021"
rust-version = "1.61"
name = "proc-macro-error2"
version = "2.0.1"
authors = [
    "CreepySkeleton <creepy-skeleton@yandex.ru>",
    "GnomedDev <david2005thomas@gmail.com>",
]
description = "Almost drop-in replacement to panics in proc-macros (vendored patch)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnomedDev/proc-macro-error-2"
publish = false

[lib]
name = "proc_macro_error2"
path = "src/lib.rs"

[dependencies.proc-macro-error-attr2]
version = "=2.0.0"

[dependencies.proc-macro2]
version = "1"

[dependencies.quote]
version = "1"

[dependencies.syn]
version = "2"
optional = true
default-features = false

[features]
default = ["syn-error"]
nightly = []
syn-error = ["dep:syn"]
